name: POC validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y cmake libopenblas-dev liblapack-dev
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile main.py database.py config.py integrations/webhook_client.py recognition_pipeline.py sync_service.py
      - run: python scripts/smoke_poc.py
      - name: Reject tracked biometric/database/env artifacts
        run: |
          ! git ls-files | grep -E '(^|/)(face_encodings\.pkl|faces\.db|\.env)$'
          ! git grep -IlE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|postgres(ql)?://[^: ]+:[^@ ]+@)' -- ':!README.md' ':!.env.example'
